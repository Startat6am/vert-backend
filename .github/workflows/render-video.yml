name: Render vertical video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and render MP4
        run: npm run render
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: vert-video-mp4
          path: video.mp4
          if-no-files-found: error
          retention-days: 7
