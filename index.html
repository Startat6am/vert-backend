<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050711" />
    <meta name="description" content="Наглядная анимация о том, как искусственный интеллект создаёт ответ." />
    <title>AI Explained — как ИИ создаёт ответ</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <span class="brand">AI EXPLAINED</span>
        <span class="header-time" id="timecode">00:00 / 00:40</span>
      </header>

      <main id="stage" aria-label="Анимация о работе нейросети">
        <div id="canvas"></div>
        <div class="vignette"></div>
        <section class="copy" aria-live="polite">
          <p class="eyebrow" id="eyebrow">КАК РАБОТАЕТ ИИ</p>
          <h1 id="headline">Как ИИ<br />создаёт ответ?</h1>
          <p id="subline">От текста запроса до следующего токена</p>
        </section>
      </main>

      <div class="controls">
        <div class="progress" aria-hidden="true"><i id="progress"></i></div>
        <button id="play-toggle" type="button" aria-label="Пауза">
          <span id="play-icon" aria-hidden="true">Ⅱ</span>
          <span id="play-label">Пауза</span>
        </button>
      </div>
      <p class="hint">Нажми на анимацию, чтобы поставить на паузу или продолжить</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
