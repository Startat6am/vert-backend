<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <meta name="description" content="Вертикальный просмотрщик интерактивных 3D-анимаций." />
  <title>VERT — Animation Viewer</title>
</head>
<body>
  <main id="viewer" class="viewer" aria-label="Просмотрщик вертикальных анимаций">
    <section class="viewer-frame" aria-label="Анимация в формате 9 на 16">
      <div id="animation-surface" class="animation-surface"></div>
      <div class="frame-shade" aria-hidden="true"></div>

      <header class="viewer-header">
        <div class="animation-heading">
          <span class="eyebrow">VERT / VISUAL STORIES</span>
          <h1 data-title>Загрузка анимации…</h1>
        </div>
        <div class="header-meta">
          <span class="timecode" data-time>00:00 / 00:00</span>
          <button class="icon-button script-open" data-script-open type="button" aria-label="Открыть сценарий" title="Сценарий">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.75h7l4 4v12.5H7a2 2 0 0 1-2-2v-12.5a2 2 0 0 1 2-2Z"/><path d="M14 3.75v4h4M9 12h6M9 15.5h6"/></svg>
          </button>
        </div>
      </header>

      <p class="empty-state" data-empty hidden>Добавь анимацию в папку <code>animations/</code>, чтобы она появилась здесь.</p>

      <footer class="viewer-footer">
        <div class="timeline-control">
          <div class="progress-track"><span data-progress></span></div>
          <input data-seek class="seek-input" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка анимации" />
        </div>
        <div class="transport">
          <button class="icon-button nav-button" data-previous type="button" aria-label="Предыдущая анимация" title="Предыдущая">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6l-9 6 9 6V6Z"/></svg>
          </button>
          <button class="play-button" data-play type="button" aria-label="Пауза">
            <span data-play-icon aria-hidden="true">Ⅱ</span>
          </button>
          <button class="icon-button nav-button" data-next type="button" aria-label="Следующая анимация" title="Следующая">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l9 6-9 6V6Z"/></svg>
          </button>
          <span class="animation-counter" data-counter>00 / 00</span>
          <button class="icon-button animation-list-button" data-animation-list-open type="button" aria-label="Список анимаций">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
          </button>
        </div>
      </footer>
    </section>

    <div class="script-modal" data-script-modal hidden>
      <section class="script-dialog" role="dialog" aria-modal="true" aria-labelledby="script-title">
        <div class="dialog-header">
          <h2 data-script-title id="script-title">Сценарий</h2>
          <button class="icon-button close-button" data-script-close type="button" aria-label="Закрыть">×</button>
        </div>
        <div class="script-content" data-script-content></div>
      </section>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
